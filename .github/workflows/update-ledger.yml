name: Update ledger data

# Refreshes data.js from Amazon and Keepa and commits it.
# The commit triggers GitHub's own Pages build, which republishes the site.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write   # commit data.js

concurrency:
  group: update-ledger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - name: Fetch data from Amazon and Keepa
        run: node scripts/update-ledger.js
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_REFRESH_TOKEN: ${{ secrets.AMAZON_REFRESH_TOKEN }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ledger data"
            git pull --rebase
            git push
          fi
