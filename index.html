<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADV Sales & Stock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Costenco "Tallow" palette */
:root{
  --t50:#F7F7F3; --t100:#E7E7DE; --t200:#CDCDBA; --t300:#ADAC8C; --t400:#A2A07D; --t500:#948D6C;
  --t600:#82795D; --t700:#6D6350; --t800:#5B5145; --t900:#4D453A; --t950:#2A241E; --olive:#545A41;
  --bg:var(--t50); --surface:#FFFFFF; --surface-2:var(--t100); --line:var(--t200);
  --fg:var(--t950); --muted:var(--t700); --faint:var(--t600);
  --head:var(--olive); --head-fg:#F7F7F3; --head-muted:#B9B8A3;
  --feature:var(--t900); --feature-fg:#F7F7F3; --feature-muted:#CDCDBA;
  --pos:#5B7A52; --neg:#A3503C; --pos-soft:rgba(91,122,82,.13); --neg-soft:rgba(163,80,60,.12);
  --shadow:0 1px 2px rgba(42,36,30,.05),0 6px 18px rgba(42,36,30,.06);
  --r:22px; --r-sm:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:var(--t950); --surface:#332C25; --surface-2:var(--t900); --line:#5B5145;
  --fg:var(--t50); --muted:#CDCDBA; --faint:#A2A07D;
  --head:#211C17; --head-fg:#F7F7F3; --head-muted:#A2A07D;
  --feature:var(--t300); --feature-fg:var(--t950); --feature-muted:var(--t800);
  --pos:#9CC08C; --neg:#E0937E; --pos-soft:rgba(156,192,140,.15); --neg-soft:rgba(224,147,126,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:var(--t950); --surface:#332C25; --surface-2:var(--t900); --line:#5B5145;
  --fg:var(--t50); --muted:#CDCDBA; --faint:#A2A07D;
  --head:#211C17; --head-fg:#F7F7F3; --head-muted:#A2A07D;
  --feature:var(--t300); --feature-fg:var(--t950); --feature-muted:var(--t800);
  --pos:#9CC08C; --neg:#E0937E; --pos-soft:rgba(156,192,140,.15); --neg-soft:rgba(224,147,126,.14);
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Poppins,system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}

/* header band with ring motif */
.hero{position:relative;overflow:visible;background:var(--head);color:var(--head-fg);padding:22px 0 84px}
.rings{position:absolute;inset:0;pointer-events:none}
.rings span{position:absolute;border-radius:50%;border:1.5px solid rgba(173,172,140,.28)}
.rings span:nth-child(1){width:420px;height:420px;right:-120px;top:-210px}
.rings span:nth-child(2){width:260px;height:260px;right:120px;top:-150px;border-color:rgba(173,172,140,.18)}
.rings span:nth-child(3){width:160px;height:160px;left:-60px;bottom:-90px;border-color:rgba(173,172,140,.2)}
.wrap{max-width:1560px;margin:0 auto;padding:0 16px;position:relative}
.brandrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{height:30px;width:auto;display:block}
.brandrow .div{width:1px;height:28px;background:rgba(247,247,243,.25)}
.brandrow h1{font-size:18px;font-weight:500;margin:0;letter-spacing:.01em}
.brandrow .spacer{flex:1}
.updated{font-size:12px;color:var(--head-muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.dd{position:relative}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;border:1px solid rgba(247,247,243,.22);
  background:rgba(247,247,243,.08);color:var(--head-fg);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.pill:hover{background:rgba(247,247,243,.16)}
.pill svg{width:15px;height:15px;flex:none;opacity:.85}
.pill .lab{color:var(--head-muted);font-weight:400}
.menu{position:absolute;top:calc(100% + 8px);left:0;z-index:1000;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:var(--r-sm);box-shadow:0 14px 40px rgba(42,36,30,.22);padding:8px;min-width:250px;max-height:72vh;overflow:auto}
.menu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--surface-2)}
.mi.on{font-weight:600}
.mi .tick{width:14px;color:var(--olive)}
.mi input{accent-color:var(--olive);width:16px;height:16px;margin:0}
.mi.sep{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;margin-bottom:4px}
.custom{display:flex;gap:8px;align-items:center;padding:10px 12px 6px;border-top:1px solid var(--line);margin-top:4px;flex-wrap:wrap}
.custom[hidden]{display:none}
.custom input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.btn{font-size:13px;font-weight:600;padding:7px 16px;border-radius:999px;border:0;background:var(--olive);color:#F7F7F3;cursor:pointer}

/* period cards */
main.wrap{margin-top:-62px;padding-bottom:56px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:#FFFFFF;border-radius:var(--r);box-shadow:var(--shadow);padding:20px 20px 14px;display:flex;flex-direction:column;min-width:0;border:1px solid transparent;color:var(--fg)}
.card.feature{background:#FFFFFF;color:var(--fg)}
.card.feature .k,.card.feature .rng,.card.feature .cell .k{color:var(--faint)}
.card.feature .cells{border-color:var(--line)}
.card.feature .netrow{background:var(--surface-2)}
.card.feature .toggle{color:var(--fg);border-color:var(--line)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pname{font-size:13px;font-weight:600;letter-spacing:.02em}
.rng{font-size:11.5px;color:var(--faint);margin-top:1px}
.dot{width:10px;height:10px;border-radius:50%;border:2.5px solid currentColor;opacity:.55;margin-top:4px;flex:none}
.k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.sales{margin-top:16px}
.bigrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.badge.pos{color:var(--pos);background:var(--pos-soft)} .badge.neg{color:var(--neg);background:var(--neg-soft)}
.card.feature .badge.pos{color:#CFE3C4;background:rgba(207,227,196,.16)} .card.feature .badge.neg{color:#F1C2B4;background:rgba(241,194,180,.16)}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cell .v{font-size:15px;font-weight:600;margin-top:2px}
.netrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding:10px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.netrow .v{font-size:18px;font-weight:700}
.det{margin-top:12px;font-size:12.5px}
.det div{display:flex;justify-content:space-between;gap:10px;padding:5px 2px;border-bottom:1px dashed var(--line)}
.card.feature .det div{border-color:rgba(205,205,186,.25)}
.det div:last-child{border-bottom:0}
.det .minus{color:var(--neg)}
.card.feature .det .minus{color:#F1C2B4}
.toggle{margin-top:12px;align-self:center;font-size:12px;font-weight:500;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.note{font-size:11.5px;color:var(--faint);margin:12px 4px 0;line-height:1.6;max-width:1100px}

/* stock section */
.stock{margin-top:30px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.shead{padding:22px 22px 16px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.shead h2{font-size:20px;font-weight:600;margin:0}
.shead .sub{font-size:12px;color:var(--faint);margin-top:2px}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 22px 16px}
.search{flex:1;min-width:200px;max-width:380px;font:inherit;font-size:13px;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg)}
.chip{font-size:12.5px;font-weight:500;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip.on{background:var(--olive);border-color:var(--olive);color:#F7F7F3}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;padding:10px 12px;white-space:nowrap;background:var(--surface-2)}
th:first-child{padding-left:22px} td:first-child{padding-left:22px}
th.r,td.r{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.prod{display:flex;gap:12px;align-items:center;min-width:300px}
.thumb{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:46px;height:46px;object-fit:contain}
.ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:500px;font-weight:500}
.ids{font-size:12px;white-space:nowrap;line-height:1.5}
.ids a{color:var(--fg);font-weight:600;text-decoration:none;border-bottom:1px solid var(--t300)}
.ids div:last-child{color:var(--faint)}
.asinrow{display:flex;align-items:center;gap:6px}
.copy{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--faint);cursor:pointer;padding:0}
.copy:hover{color:var(--fg);border-color:var(--t300)}
.copy svg{width:13px;height:13px}
.copy.done{color:var(--pos);border-color:var(--pos)}
.ean{display:block;font-size:11.5px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.ptext{min-width:0}
.pool{font-size:11px;font-weight:600;color:var(--t700);background:var(--t100);border-radius:999px;padding:3px 10px;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pool{color:var(--t100);background:var(--t800)}}
:root[data-theme="dark"] .pool{color:var(--t100);background:var(--t800)}
.fc{min-width:150px}
.fcwrap{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.fcv{font-size:16px;font-weight:700;min-width:56px;text-align:right}
.fcbar{width:70px;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:none}
.fcbar i{display:block;height:100%;border-radius:999px;background:var(--t300)}
.zero{color:var(--t300)}
.sfoot{padding:14px 22px;color:var(--faint);font-size:12px;border-top:1px solid var(--line)}

/* modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(42,36,30,.3);backdrop-filter:blur(2px);z-index:1001;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r);box-shadow:0 20px 60px rgba(42,36,30,.3);max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:24px}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border:0;background:var(--surface-2);border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--faint)}
.modal-close:hover{color:var(--fg);background:var(--line)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:10px;padding-right:32px}
.modal-asin{font-size:12px;color:var(--faint);font-weight:500;font-family:monospace}
.modal-section{margin-top:20px}
.modal-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:12px}
.inv-breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
.inv-item{padding:12px;background:var(--surface-2);border-radius:var(--r-sm);border-left:3px solid var(--t300)}
.inv-item.total{grid-column:1/-1;border-left-color:var(--feature)}
.inv-item-label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.inv-item-value{font-size:20px;font-weight:700;letter-spacing:-.02em}
.inv-status{margin-top:16px;padding:12px;background:var(--pos-soft);border-radius:var(--r-sm);border-left:3px solid var(--pos);font-size:12.5px;color:var(--pos)}
.inv-status span{font-weight:600}
.modal-note{font-size:12px;color:var(--faint);line-height:1.6;margin-top:16px}

/* tabs */
.tab-btn{font-size:12px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:all 0.2s}
.tab-btn:hover{color:var(--fg);border-color:var(--t300)}
.tab-btn.active{background:var(--olive);border-color:var(--olive);color:#F7F7F3}
.tab-content{display:none}
.tab-content.active{display:block}
@media (max-width:640px){.big{font-size:26px}.brandrow .div,.brandrow h1{display:none}.hero{padding-bottom:76px}.inv-breakdown{grid-template-columns:1fr}}
.stats.hidden{display:none!important}
</style>
</head><body>

<script src="data.js"></script>
<script>
// DAYS[date][mkt] = [orders, units, sales, vat, fees, cogs, pendingUnits, refundUnits, refundCost]; DAYS[date]._ = other fees

const store = { get(k,d){ try{ const v=localStorage.getItem("adv:"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem("adv:"+k, JSON.stringify(v)); }catch(e){} } };
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => "€" + (n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const eurAbs = n => eur(Math.abs(n||0));
const int = n => Math.round(n||0).toLocaleString("en-US");

// ---------- dates (YYYY-MM-DD strings, calendar math in UTC)
const D = s => new Date(s+"T00:00:00Z");
const S = d => d.toISOString().slice(0,10);
const add = (s,n) => { const d=D(s); d.setUTCDate(d.getUTCDate()+n); return S(d); };
const ym = (y,m) => { const d=new Date(Date.UTC(y,m,1)); return [d.getUTCFullYear(), d.getUTCMonth()]; };
const monthStart = (s,off=0) => { const d=D(s); const [y,m]=ym(d.getUTCFullYear(), d.getUTCMonth()+off); return S(new Date(Date.UTC(y,m,1))); };
const monthEnd = (s,off=0) => add(monthStart(s,off+1), -1);
const qStart = (s,off=0) => { const d=D(s); const q=Math.floor(d.getUTCMonth()/3)+off; const [y,m]=ym(d.getUTCFullYear(), q*3); return S(new Date(Date.UTC(y,m,1))); };
const qEnd = (s,off=0) => add(qStart(s,off+1), -1);
const weekStart = (s,off=0) => { const d=D(s); const dow=(d.getUTCDay()+6)%7; return add(s, -dow + 7*off); };
const days = (a,b) => Math.round((D(b)-D(a))/864e5)+1;
const minS = (a,b) => a<b?a:b;
const fmtD = s => D(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
const fmtRange = (a,b) => a===b ? fmtD(a) : (D(a).getUTCFullYear()===D(b).getUTCFullYear()
  ? D(a).toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"})+" – "+fmtD(b) : fmtD(a)+" – "+fmtD(b));

const T = META.today;
const P = {
  today:   () => ({name:"Today", from:T, to:T, cmp:null}),
  yest:    () => ({name:"Yesterday", from:add(T,-1), to:add(T,-1), cmp:[add(T,-2),add(T,-2)]}),
  dAgo:    n => ({name:`${n} days ago`, from:add(T,-n), to:add(T,-n), cmp:[add(T,-n-1),add(T,-n-1)]}),
  mtd:     () => { const n=days(monthStart(T),T); const ps=monthStart(T,-1); return {name:"Month to date", from:monthStart(T), to:T, cmp:[ps, minS(add(ps,n-1), monthEnd(T,-1))]}; },
  fc:      () => ({name:"This month · forecast", from:monthStart(T), to:monthEnd(T), cmp:[monthStart(T,-1), monthEnd(T,-1)], forecast:true}),
  month:   k => ({name: k===1?"Last month":`${k} months ago`, from:monthStart(T,-k), to:monthEnd(T,-k), cmp:[monthStart(T,-k-1), monthEnd(T,-k-1)]}),
  lastN:   n => ({name:`Last ${n} days`, from:add(T,-n), to:add(T,-1), cmp:[add(T,-2*n), add(T,-n-1)]}),
  week:    k => { const a=weekStart(T,-k), b=k===0?T:add(a,6); const n=days(a,b); const pa=weekStart(T,-k-1);
                  return {name:k===0?"This week":k===1?"Last week":`${k} weeks ago`, from:a, to:b, cmp:[pa, add(pa,n-1)]}; },
  quarter: k => { const a=qStart(T,-k), b=k===0?T:qEnd(T,-k); const pa=qStart(T,-k-1);
                  return {name:k===0?"This quarter":k===1?"Last quarter":`${k} quarters ago`, from:a, to:b, cmp:[pa, minS(add(pa,days(a,b)-1), qEnd(T,-k-1))]}; },
};
const PRESETS = [
  ["Yesterday · Month to date · Last month · Forecast", () => [P.yest(),P.mtd(),P.month(1),P.fc()]],
  ["Yesterday · Month to date · Last month", () => [P.yest(),P.mtd(),P.month(1)]],
  ["Yesterday · 7 · 14 · 30 days", () => [P.yest(),P.lastN(7),P.lastN(14),P.lastN(30)]],
  ["This week · Last week · 2 weeks ago · 3 weeks ago", () => [P.week(0),P.week(1),P.week(2),P.week(3)]],
  ["Month to date · Last month · 2 months ago · 3 months ago", () => [P.mtd(),P.month(1),P.month(2),P.month(3)]],
  ["Yesterday · 2 days ago · 3 days ago · 4 days ago", () => [P.yest(),P.dAgo(2),P.dAgo(3),P.dAgo(4)]],
  ["Yesterday · 7 days ago · 8 days ago · 9 days ago", () => [P.yest(),P.dAgo(7),P.dAgo(8),P.dAgo(9)]],
  ["This quarter · Last quarter · 2 quarters ago · 3 quarters ago", () => [P.quarter(0),P.quarter(1),P.quarter(2),P.quarter(3)]],
];
const SHORT = ["Accurate data","Accurate · months","Rolling days","Weeks","Months","Last few days","Week-on-week days","Quarters"];
const DOTS = ["var(--t300)","var(--t500)","var(--t600)","var(--t400)","var(--t700)"];

// ---------- state
const ALL = META.markets.map(m=>m[0]);
let preset = store.get("preset", 0);
if (!(preset >= 0 && preset < PRESETS.length)) preset = 0;
let custom = store.get("custom", null);
let sel = new Set(store.get("mkts", ALL).filter(m=>ALL.includes(m)));
if (!sel.size) sel = new Set(ALL);   // never open on an empty selection

// ---------- aggregation
function agg(from, to) {
  const t = {o:0,u:0,s:0,v:0,fee:0,cogs:0,pend:0,ru:0,rc:0,oth:0};
  const allSel = sel.size === ALL.length;
  for (let d=from; d<=to; d=add(d,1)) {
    const day = DAYS[d]; if (!day) continue;
    for (const m of sel) { const r = day[m]; if (!r) continue;
      t.o+=r[0]; t.u+=r[1]; t.s+=r[2]; t.v+=r[3]; t.fee+=r[4]; t.cogs+=r[5]; t.pend+=r[6]; t.ru+=r[7]; t.rc+=r[8]; }
    if (allSel && day._) t.oth += day._;
  }
  return finish(t);
}
function finish(t) {
  t.payout = t.s - t.fee - t.rc - t.oth;
  t.gross = t.payout - t.v - t.cogs;
  t.adv = 0;
  t.net = t.gross - t.adv;
  t.margin = t.s ? t.net / t.s * 100 : 0;
  t.roi = t.cogs ? t.net / t.cogs * 100 : 0;
  return t;
}
function forecast(p) {
  const mtd = agg(p.from, T);
  const ref = agg(add(T,-30), add(T,-1));        // last 30 full days
  const left = days(T, p.to) - 1;
  const f = {}; for (const k of ["o","u","s","v","fee","cogs","ru","rc","oth"]) f[k] = mtd[k] + ref[k]/30*left;
  f.pend = mtd.pend;
  return finish(f);
}
const pct = (a,b) => (b && isFinite(a/b)) ? (a-b)/Math.abs(b)*100 : null;
const badge = v => v==null ? "" : `<span class="badge ${v>=0?"pos":"neg"}">${v>=0?"▲":"▼"} ${Math.abs(v).toFixed(1)}%</span>`;

// ---------- period cards
const openMore = new Set();
function periods() {
  if (custom) { const n=days(custom.from,custom.to);
    return [{name:"Custom range", from:custom.from, to:custom.to, cmp:[add(custom.from,-n), add(custom.from,-1)]}]; }
  return PRESETS[preset][1]();
}
function renderCards() {
  const ps = periods();
  $("cards").innerHTML = ps.map((p,i) => {
    const t = p.forecast ? forecast(p) : agg(p.from, p.to);
    const c = p.cmp ? agg(p.cmp[0], p.cmp[1]) : null;
    const key = p.name, open = openMore.has(key);
    return `<article class="card ${i===0?"feature":""}">
      <div class="chead"><div><div class="pname">${p.name}</div><div class="rng">${fmtRange(p.from,p.to)}</div></div>
        <span class="dot" style="color:${i===0?"currentColor":DOTS[i%5]}"></span></div>
      <div class="sales"><div class="k">Sales</div>
        <div class="bigrow"><span class="big num">${eur(t.s)}</span>${c?badge(pct(t.s,c.s)):""}</div></div>
      <div class="cells">
        <div class="cell"><div class="k">Orders / Units</div><div class="v num">${int(t.o)} / ${int(t.u)}</div></div>
        <div class="cell"><div class="k">Refunds</div><div class="v num">${int(t.ru)}</div></div>
        <div class="cell"><div class="k">Est. payout</div><div class="v num">${eur(t.payout)}</div></div>
        <div class="cell"><div class="k">Gross profit</div><div class="v num">${eur(t.gross)}</div></div>
      </div>
      <div class="netrow"><div><div class="k">Net profit</div><div class="v num">${eur(t.net)}</div></div>${c?badge(pct(t.net,c.net)):""}</div>
      ${open ? `<div class="det">
        <div><span>Sales</span><b class="num">${eur(t.s)}</b></div>
        <div><span>Amazon fees</span><b class="num minus">−${eurAbs(t.fee)}</b></div>
        <div><span>Refund cost</span><b class="num minus">−${eurAbs(t.rc)}</b></div>
        <div><span>Other Amazon fees</span><b class="num ${t.oth>0?"minus":""}">${t.oth>0?"−":"+"}${eurAbs(t.oth)}</b></div>
        <div><span>Est. payout</span><b class="num">${eur(t.payout)}</b></div>
        <div><span>VAT (est.)</span><b class="num minus">−${eurAbs(t.v)}</b></div>
        <div><span>Cost of goods</span><b class="num minus">−${eurAbs(t.cogs)}</b></div>

let monthlyMarket = store.get("monthlyMarket", "DE");
let monthlyPeriod = store.get("monthlyPeriod", "month-to-date");
let monthlyCustomFrom = store.get("monthlyCustomFrom", null);
let monthlyCustomTo = store.get("monthlyCustomTo", null);
let monthlySearch = "";

function getPeriodMonths(period) {
  const today = new Date();
  const currentMonth = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0");
  const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  const lastMonthStr = lastMonth.getFullYear() + "-" + String(lastMonth.getMonth() + 1).padStart(2, "0");
  const ninetyDaysAgo = new Date(today.getTime() - 90 * 24 * 60 * 60 * 1000);
  const ninetyDaysMonth = ninetyDaysAgo.getFullYear() + "-" + String(ninetyDaysAgo.getMonth() + 1).padStart(2, "0");

  switch(period) {
    case "month-to-date": return [currentMonth];
    case "last-month": return [lastMonthStr];
    case "last-30d": return [currentMonth, lastMonthStr];
    case "all-time": return Object.keys(MONTHLY_SALES.months || {});
    case "custom": return monthlyCustomFrom && monthlyCustomTo ? getMonthsInRange(monthlyCustomFrom, monthlyCustomTo) : [currentMonth];
    default: return [currentMonth];
  }
}

function getMonthsInRange(from, to) {
  const months = [];
  const fromDate = new Date(from + "-01");
  const toDate = new Date(to + "-01");
  let current = new Date(fromDate);
  while (current <= toDate) {
    const year = current.getFullYear();
    const month = String(current.getMonth() + 1).padStart(2, "0");
    months.push(year + "-" + month);
    current.setMonth(current.getMonth() + 1);
  }
  return months;
}

function renderMonthlyTab() {
  $("stats").classList.add("hidden");
  if (!MONTHLY_SALES || !MONTHLY_SALES.months) return;
  const months = MONTHLY_SALES.months;
  const keepa = MONTHLY_SALES.keepa || {};
  const sku_asin = {};
  INV.forEach(r => { sku_asin[r.sku] = r.asin; });

  const allowedMonths = getPeriodMonths(monthlyPeriod);
  const isAllMarkets = monthlyMarket === "ALL";
  // Get all unique marketplaces from the data (not just EU4)
  const allAvailableMarkets = new Set();
  if (MONTHLY_SALES && MONTHLY_SALES.months) {
    for (const month of Object.values(MONTHLY_SALES.months)) {
      for (const mkt of Object.keys(month)) {
        allAvailableMarkets.add(mkt);
      }
    }
  }
  const markets = isAllMarkets ? Array.from(allAvailableMarkets) : [monthlyMarket];

  const qq = monthlySearch.trim().toLowerCase();
  const rowsByProduct = {};

  for (const [month, mkts] of Object.entries(months).sort().reverse()) {
    if (!allowedMonths.includes(month)) continue;
    for (const mkt of markets) {
      if (!mkts[mkt]) continue;
      for (const [key, [units, revenue, avg_price]] of Object.entries(mkts[mkt])) {
        const [sku, dataMarket] = key.split("|");
        const asin = sku_asin[sku] || "";
        const prod = INV.find(r => r.sku === sku) || {};
        if (qq && !(prod.title + " " + asin + " " + sku).toLowerCase().includes(qq)) continue;

        const prodKey = asin + "|" + sku + "|" + month;
        if (!rowsByProduct[prodKey]) {
          rowsByProduct[prodKey] = {
            month, sku, asin, title: prod.title || sku, units: 0, revenue: 0,
            market_ests: {}, bsrs: {}, buyboxes: {}
          };
        }
        rowsByProduct[prodKey].units += Math.round(units);
        rowsByProduct[prodKey].revenue += Math.round(revenue * 100) / 100;

        const keepa_data = keepa[asin]?.[mkt] || {};
        rowsByProduct[prodKey].market_ests[mkt] = keepa_data.est_sales_30d || null;
        rowsByProduct[prodKey].bsrs[mkt] = keepa_data.bsr || null;
        rowsByProduct[prodKey].buyboxes[mkt] = keepa_data.has_buybox !== null ? (keepa_data.has_buybox ? "Yes" : "No") : null;
      }
    }
  }

  const rows = Object.values(rowsByProduct).map(r => ({
    ...r,
    market_est: isAllMarkets ? Object.values(r.market_ests).filter(v => v).join(" / ") || "-" : (r.market_ests[monthlyMarket] || "-"),
    bsr: isAllMarkets ? Object.values(r.bsrs).filter(v => v !== null).join(" / ") || "-" : (r.bsrs[monthlyMarket] || "-"),
    buybox: isAllMarkets ? [...new Set(Object.values(r.buyboxes).filter(v => v))].join(", ") || "–" : (r.buyboxes[monthlyMarket] || "-")
  }));

  // Sort by units descending (highest to lowest)
  rows.sort((a, b) => b.units - a.units);

  $("monthlyTable").innerHTML = rows.map(r => `<tr>
    <td><span style="font-weight:500">${esc(r.title)}</span><div style="font-size:11px;color:var(--faint)">${r.sku}</div></td>
    <td style="font-family:monospace;font-size:11px">${r.asin}</td>
    <td style="font-size:11px">${r.month}</td>
    <td class="r num">${int(r.units)}</td>
    <td class="r num">${typeof r.market_est === 'number' ? int(r.market_est) : r.market_est}</td>
    <td class="r num">€${r.revenue.toFixed(2)}</td>
    <td class="r" style="font-family:monospace;font-size:11px">${typeof r.bsr === 'number' ? int(r.bsr) : r.bsr}</td>
    <td class="r">${r.buybox}</td>
  </tr>`).join("") || `<tr><td colspan="8" class="zero" style="padding:22px">No monthly sales data${isAllMarkets?" across all markets.":" for "+monthlyMarket+"."}</td></tr>`;

  const marketLabel = isAllMarkets ? "all markets combined" : monthlyMarket;
  $("monthlySummary").textContent = `Your sales from Amazon orders. Market Est. and BSR from Keepa API. Market: ${marketLabel}`;
}

function renderWatchlist() {
  const search = $("watchlistSearch").value.toLowerCase();
  const status = $("filterStatus2").value;
  const supplier = $("filterSupplier").value;
  const brand = $("filterBrand").value;
  const market = $("watchlistMarket").value;

  let filtered = WATCHLIST.products || [];
  if (search) {
    filtered = filtered.filter(p =>
      p.asin.toLowerCase().includes(search) ||
      p.name.toLowerCase().includes(search)
    );
  }
  if (status) {
    filtered = filtered.filter(p => p.status === status);
  }
  if (supplier) {
    filtered = filtered.filter(p => p.supplier === supplier);
  }
  if (brand) {
    filtered = filtered.filter(p => p.brand === brand);
  }

  const html = filtered.map(p => {
    const keepaData = KEEPA[p.asin] || {};
    const mkData = market === "ALL" ? null : (keepaData[market] || {});
    const panEuSales = market === "ALL" ? "—" : (mkData?.est_sales_30d ? int(mkData.est_sales_30d) : "—");
    const imgHtml = p.image ? `<img src="${esc(p.image)}" style="height:40px;width:40px;object-fit:cover;border-radius:4px;background:var(--surface-2)" alt="" onerror="this.style.display='none'" crossorigin="anonymous">` : `<div style="height:40px;width:40px;background:var(--surface-2);border-radius:4px"></div>`;

    return `<tr style="vertical-align:middle">
      <td style="padding:6px 0">${imgHtml}</td>
      <td style="font-size:11px;font-family:monospace">${esc(p.asin)}</td>
      <td><strong>${esc(p.brand || "")}</strong><br><span style="font-size:11px;color:var(--faint)">${esc(p.name)}</span></td>
      <td><span style="padding:3px 8px;border-radius:6px;background:var(--surface-2);font-size:12px">${esc(p.status)}</span></td>
      <td class="r">€${(p.cost || 0).toFixed(2)}</td>
      <td>${esc(p.supplier || "—")}</td>
      <td class="r">${p.costenco_sales || 0}</td>
      <td class="r">${panEuSales}</td>
      <td class="r">€${(p.rrp || 0).toFixed(2)}</td>
      <td class="r">€${(p.avg_margin_10pct || 0).toFixed(2)}</td>
      <td style="text-align:center"><button class="commentBtn" data-asin="${esc(p.asin)}" title="Add/view comments" style="background:var(--olive);color:#F7F7F3;border:0;border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer;font-weight:500">💬</button></td>
    </tr>`;
  }).join("");

  $("watchlistTable").innerHTML = html || "<tr><td colspan='12' style='text-align:center;color:var(--faint)'>No products match your filters</td></tr>";
  $("watchlistFoot").textContent = `Showing ${filtered.length} of ${WATCHLIST.products?.length || 0} products`;

  // Add click handlers to comment buttons
  document.querySelectorAll('.commentBtn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      openCommentModal(btn.dataset.asin);
    };
  });
}

// Populate brand and supplier filter dropdowns
function populateBrandFilter() {
  const brands = [...new Set((WATCHLIST.products || []).map(p => p.brand).filter(Boolean))].sort();
  const sel = $("filterBrand");
  sel.innerHTML = '<option value="">All Brands</option>' +
    brands.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
}

function populateSupplierFilter() {
  const suppliers = [...new Set((WATCHLIST.products || []).map(p => p.supplier).filter(Boolean))].sort();
  const sel = $("filterSupplier");
  sel.innerHTML = '<option value="">All Suppliers</option>' +
    suppliers.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
}
populateBrandFilter();
populateSupplierFilter();

// Comment system functions
function openCommentModal(asin) {
  const product = (WATCHLIST.products || []).find(p => p.asin === asin);
  if (!product) return;
  $("commentTitle").textContent = `${esc(product.name)} (${asin})`;
  $("commentInput").value = "";
  renderComments(asin);
  $("commentModal").style.display = "flex";
}

function renderComments(asin) {
  if (!WATCHLIST.comments) WATCHLIST.comments = {};
  const comments = WATCHLIST.comments[asin] || [];
  const html = comments.map(c => `<div style="background:var(--surface);padding:8px;border-radius:4px;margin-bottom:8px;font-size:12px">
    <div style="font-weight:500;color:var(--olive)">${esc(c.author || "Unknown")}</div>
    <div style="color:var(--faint);font-size:11px;margin-top:2px">${new Date(c.timestamp).toLocaleString()}</div>
    <div style="margin-top:6px;color:var(--fg);white-space:pre-wrap">${esc(c.text).replace(/@(\w+)/g, '<span style="color:var(--olive);font-weight:500">@$1</span>')}</div>
  </div>`).join("");
  $("commentsList").innerHTML = html || "<div style='color:var(--faint);font-size:12px'>No comments yet</div>";
}

function submitComment(asin) {
  const text = $("commentInput").value.trim();
  if (!text) return;
  if (!WATCHLIST.comments) WATCHLIST.comments = {};
  if (!WATCHLIST.comments[asin]) WATCHLIST.comments[asin] = [];
  WATCHLIST.comments[asin].push({
    author: "You",
    timestamp: new Date().toISOString(),
    text: text
  });
  localStorage.setItem("watchlist_data", JSON.stringify(WATCHLIST));
  fetch("/api/update-comments", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({asin, comments: WATCHLIST.comments[asin]})
  }).catch(() => {});
  $("commentInput").value = "";
  renderComments(asin);
}

// Comment modal event handlers
$("commentClose").addEventListener("click", () => {
  $("commentModal").style.display = "none";
});
$("commentSubmit").addEventListener("click", () => {
  const asin = $("commentTitle").textContent.match(/\((\w+)\)$/)?.[1];
  if (asin) submitComment(asin);
});
$("commentInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.ctrlKey) {
    const asin = $("commentTitle").textContent.match(/\((\w+)\)$/)?.[1];
    if (asin) submitComment(asin);
  }
});
$("commentModal").addEventListener("click", () => {
  $("commentModal").style.display = "none";
});

// Load comments from localStorage on init
if (localStorage.getItem("watchlist_data")) {
  const saved = JSON.parse(localStorage.getItem("watchlist_data"));
  if (saved.comments) WATCHLIST.comments = saved.comments;
}

$("watchlistSearch").addEventListener("input", renderWatchlist);
$("watchlistStatus").addEventListener("change", renderWatchlist);
$("watchlistMarket").addEventListener("change", renderWatchlist);
$("filterBrand").addEventListener("change", renderWatchlist);
$("filterStatus2").addEventListener("change", renderWatchlist);
$("filterSupplier").addEventListener("change", renderWatchlist);

// Initial render on page load
renderWatchlist();

// ---------- tab switching
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const tabName = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    $(`${tabName}Content`).classList.add("active");

    if (tabName === "monthly" || tabName === "watchlist") {
      $("stats").style.setProperty("display", "none", "important");
    } else {
      $("stats").style.setProperty("display", "flex", "important");
    }

    if (tabName === "watchlist") {
      renderWatchlist();
    }
  });
});

// Hide stats if monthly tab is already active
const initialTab = document.querySelector(".tab-btn.active");
if (initialTab && initialTab.dataset.tab === "monthly") {
  $("stats").style.display = "none";
}

</script>
</body></html>
